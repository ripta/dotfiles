# squid.conf - Outbound proxy filter for `crated`-sandboxed processes.
#
# Run (config path is explicit since defaults live elsewhere):
#   squid -f ~/.dotfiles/policies/squid/squid.conf       # daemonize
#   squid -N -f ~/.dotfiles/policies/squid/squid.conf    # foreground
#
# Reload after editing allowed.txt (no restart, existing connections kept):
#   squid -k reconfigure -f ~/.dotfiles/policies/squid/squid.conf
#
# Loopback-only. Allowlist by destination hostname; HTTPS is filtered via
# CONNECT (hostname from SNI / CONNECT target). URL-path filtering would
# require SSL bumping and is intentionally not configured.

http_port 127.0.0.1:3128

# Restrict CONNECT tunneling to 443 so the proxy cannot be abused to reach
# arbitrary TCP services (SSH, databases, etc.) on allowlisted hosts.
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# Allowlist sourced from a sibling file under version control. The path is
# absolute because Squid does not expand ${HOME}; update if this repo lives
# somewhere other than ~/.dotfiles.
acl allowed_domains dstdomain "/Users/ripta/.dotfiles/policies/squid/allowed.txt"

http_access allow allowed_domains
http_access deny all

# This proxy is a filter, not a cache.
cache deny all
